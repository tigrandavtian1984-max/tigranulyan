<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Все работы фотографа Тиграна (tigranulyan, тигранулян).">
<meta name="theme-color" content="#2b2d32">
<link rel="canonical" href="https://tigranulyan.ru/gallery.html">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Все работы — tigranulyan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600&family=Unbounded:wght@400;500;700;800&display=swap">
<style>
/* All-works page: same dark graphite and mirror lettering as the main page; photos in calm columns, each keeping its own shape, with its colour glow and living edge. */
:root{color-scheme:dark;--bg-top:#3a3d44;--bg-mid:#2b2d32;--bg-low:#202125;--fg:#eceef1;--muted:#a9acb4;--faint:#80838b;--line:rgba(255,255,255,.11);--glass:rgba(255,255,255,.055);--gold:#e7d29a;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;--f-wide:'Unbounded','Arial Black',system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--fg);font-family:var(--f-body);-webkit-font-smoothing:antialiased;
  background:radial-gradient(60% 40% at 88% 0%,rgba(161,176,195,.18),transparent 70%),radial-gradient(55% 35% at 4% 50%,rgba(122,24,32,.28),transparent 70%),linear-gradient(180deg,var(--bg-top),var(--bg-mid) 30%,var(--bg-low));background-attachment:fixed}
a{color:inherit;text-decoration:none}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}
.wrap{max-width:1240px;margin:0 auto;padding:20px clamp(16px,4vw,40px) 80px}
nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 10px 10px 20px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
nav .logo{font-family:var(--f-wide);font-weight:500;font-size:14px;letter-spacing:.04em}
nav a.back{padding:9px 16px;border-radius:999px;font-size:14px;color:var(--muted)}
nav a.back:hover{background:rgba(255,255,255,.08);color:var(--fg)}
nav .right{display:flex;align-items:center;gap:8px}
.lang{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);flex:none}
.lang::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:linear-gradient(150deg,#ffffff,#b9bec6 55%,#e9ebee);box-shadow:0 2px 10px rgba(0,0,0,.35);transition:translate .35s cubic-bezier(.2,.7,.2,1)}
.lang[data-on=en]::before{translate:100%}
.lang button{all:unset;position:relative;z-index:1;min-width:24px;padding:7px 11px;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted);cursor:pointer;text-align:center;border-radius:999px;transition:color .3s}
.lang button[aria-pressed=true]{color:#1d1d20}
.lang button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mirror{font-family:var(--f-wide);font-weight:800;letter-spacing:-.035em;line-height:1;margin:0;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.95) 49%,transparent 60%) 0 0/260% 100% no-repeat,linear-gradient(180deg,#fff 0%,#eef0f3 18%,#c3c7ce 40%,#8f949c 50%,#d6d9de 58%,#f8f9fa 74%,#b3b8bf 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.35)) drop-shadow(0 10px 24px rgba(0,0,0,.25));animation:sheen 6s ease-in-out infinite}
@keyframes sheen{0%{background-position:130% 0,0 0}55%,100%{background-position:-130% 0,0 0}}
h1.mirror{font-size:clamp(34px,6vw,72px);margin-top:clamp(40px,6vw,72px)}
.count{margin:14px 0 0;color:var(--faint);font-size:14px}
.cols{columns:3 300px;column-gap:clamp(18px,2.4vw,30px);margin-top:clamp(28px,4vw,48px)}
.shot{all:unset;box-sizing:border-box;position:relative;display:block;width:100%;margin-bottom:clamp(18px,2.4vw,30px);break-inside:avoid;cursor:zoom-in;border-radius:20px;isolation:isolate}
.shot .glow{position:absolute;inset:6%;z-index:-1;width:88%;height:88%;object-fit:cover;filter:blur(34px) saturate(1.6);opacity:.7;transform:scale(1.1);border-radius:28px}
.fr{position:relative;display:block;border-radius:20px;box-shadow:0 0 22px -6px var(--c1,#cfd3da),0 30px 60px -30px rgba(0,0,0,.7);transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.shot:hover .fr{transform:translateY(-4px) scale(1.012)}
.pic{position:relative;display:block;width:100%;height:auto;border-radius:19px}
/* living frame: a thin shimmering edge of silver and the photo's own colours; drawn behind the photo so only its 2px rim shows; only the colour angle animates (no big layers or masks), and only while the photo is on screen */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
.edge{position:absolute;inset:-2px;border-radius:inherit;pointer-events:none;
  background:conic-gradient(from var(--ang),var(--c1,#cfd3da),#ffffff 12%,#8d929a 24%,var(--c2,#e9ebee) 38%,#f6f7f9 50%,var(--c1,#cfd3da) 62%,#7a7f87 76%,var(--c2,#ffffff) 88%,var(--c1,#cfd3da))}
.on .edge{animation:edge 7s linear infinite}
@keyframes edge{to{--ang:360deg}}
.edge{opacity:0;transition:opacity .6s}.ok>.edge{opacity:1}
.lb{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;background:rgba(18,18,21,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);cursor:zoom-out}
.lb img{max-width:100%;max-height:calc(100vh - 48px);border-radius:16px;box-shadow:0 40px 80px -20px rgba(0,0,0,.8)}
footer{margin-top:56px;padding-top:22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--faint)}
@supports (animation-timeline: view()){@media (prefers-reduced-motion:no-preference){
  .shot{animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 25%}
  @keyframes rise{from{opacity:0;transform:translateY(50px) scale(.95);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
  @media (max-width:860px){@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}}}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0s!important;animation-iteration-count:1!important;transition:none!important}}

/* phones: no blurred photo copies (they cost a lot of memory); the frame's own coloured light replaces them */
@media (max-width:860px){.shot .glow{display:none}.shot .fr{box-shadow:0 0 30px -4px var(--c1,#cfd3da),0 24px 40px -24px rgba(0,0,0,.7)}}
</style>
</head>
<body data-title-en="All work — tigranulyan">
<div class="wrap">
  <nav><a class="logo" href="./">TIGRANULYAN</a><span class="right"><a class="back" href="./#more" data-i18n="gal.back">← На главную</a><span class="lang" role="group" aria-label="Язык / Language"><button type="button" data-l="ru">RU</button><button type="button" data-l="en">EN</button></span></span></nav>
  <h1 class="mirror" data-i18n="gal.h">Все работы</h1>
  <p class="count" id="count"></p>
  <div class="cols" id="cols"></div>
  <footer><span data-i18n="foot.copy">© 2026 Тигран · tigranulyan</span><a href="./#contacts" data-i18n="foot.write">Написать мне →</a></footer>
</div>
<div class="lb" id="lb" hidden><img id="lbimg" alt=""></div>
<script src="photos.js"></script>
<script src="i18n.js"></script>
<script>
(function(){
const seen=new Set(),all=[...(window.MORE||[]),...window.PHOTOS].filter(p=>!seen.has(p.src)&&seen.add(p.src));
const n=all.length,cnt=document.getElementById('count');
const word=()=>I18N.lang==='en'?n+(n===1?' photo':' photos'):n+' '+(n%10===1&&n%100!==11?'фотография':[2,3,4].includes(n%10)&&![12,13,14].includes(n%100)?'фотографии':'фотографий');
cnt.textContent=word();document.addEventListener('langchange',()=>{cnt.textContent=word()});
const cols=document.getElementById('cols');
cols.innerHTML=all.map(p=>`<button class="shot" data-src="${p.src}" aria-label="${I18N.T('open')}${p.alt?': '+p.alt:''}"><img class="glow" src="${p.src.replace('photos/','photos/t/')}" alt="" aria-hidden="true" loading="lazy"><span class="fr"><span class="edge"></span><img class="pic" src="${p.src}" srcset="${p.src.replace('photos/','photos/m/')} 1100w, ${p.src} 1800w" sizes="(max-width:560px) 340px, (max-width:900px) 300px, 33vw" alt="${p.alt||''}" width="${p.w}" height="${p.h}" loading="lazy" decoding="async"></span></button>`).join('');
/* frame colours from each photo: its most vivid tone and its average */
const cv=document.createElement('canvas');cv.width=cv.height=12;const cx=cv.getContext('2d',{willReadFrequently:true});
cols.querySelectorAll('.fr').forEach(f=>{const img=f.querySelector('.pic'),go=()=>{try{cx.drawImage(img,0,0,12,12);const d=cx.getImageData(0,0,12,12).data;let R=0,G=0,B=0,best=[200,205,215],bs=-1;
  for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];R+=r;G+=g;B+=b;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),s=(mx-mn)*(mx/255);if(s>bs){bs=s;best=[r,g,b]}}
  const m=d.length/4,lift=v=>Math.min(255,Math.round(v*1.35+40));f.style.setProperty('--c1',`rgb(${best.map(lift).join(',')})`);f.style.setProperty('--c2',`rgb(${lift(R/m)},${lift(G/m)},${lift(B/m)})`)}catch(_){}f.classList.add('ok')};
  img.complete&&img.naturalWidth?go():img.addEventListener('load',go,{once:true})});
const live=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('on',e.isIntersecting)),{rootMargin:'100px'});
cols.querySelectorAll('.fr').forEach(f=>live.observe(f));
I18N.apply();
const lb=document.getElementById('lb'),lbimg=document.getElementById('lbimg');
cols.addEventListener('click',e=>{const b=e.target.closest('.shot');if(!b)return;lbimg.src=b.dataset.src;lbimg.alt=b.querySelector('.pic').alt;lb.hidden=false});
lb.addEventListener('click',()=>{lb.hidden=true});
addEventListener('keydown',e=>{if(e.key==='Escape')lb.hidden=true});
})();
</script>
</body>
</html>
